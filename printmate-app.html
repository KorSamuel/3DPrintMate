<title>PrintMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@700;800;900&display=swap">
<style>
/* Layout: responsive web app. Wide screens: left sidebar + centered content up to 1180px with two-column pages. Phones: bottom tab bar, single column. */
/* Theme: Discord DESIGN.md (DESIGN-discord.md) — deep-indigo canvas, Blurple actions, green for the one high-intent CTA, magenta accents. Dark only. */
:root{
  --desk:#05072A; --bg:#0A0D3A; --surface:#1E2353; --sunk:#2A3068; --ink:#FFFFFF; --muted:#B5B9DA; --faint:#7C82B3;
  --line:#2E3470; --accent:#5865F2; --accent-ink:#FFFFFF; --accent-soft:#272E7A; --accent-text:#9AA2FF;
  --green:#35ED7E; --green-ink:#000000; --magenta:#EC48BD; --link:#00B0F4;
  --warn:#FFB547; --warn-soft:#3D3020; --bad:#FF6B7A; --bad-soft:#47203A; --info:#00B0F4; --info-soft:#13305A;
  --plate:#23272A; --shadow:0 3px 68px rgba(69,42,124,.35);
  --grad:linear-gradient(135deg,#5865F2 0%,#8B4FE0 55%,#EC48BD 100%);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Hanken Grotesk","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-xl:40px; --r-lg:16px; --r-md:14px; --r-sm:12px;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

/* ---------- shell ---------- */
.frame{position:relative;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:96px;min-width:0}
.view{display:flex;flex-direction:column;gap:16px;width:100%;max-width:1180px;margin:0 auto}
.pad{padding-inline:16px}
.split{display:flex;flex-direction:column;gap:14px}
.split > div{display:flex;flex-direction:column;gap:14px;min-width:0}
.desk-only{display:none!important}

/* ---------- nav ---------- */
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{color:var(--accent-text)}
.nav button[aria-current="page"] svg{stroke:var(--accent)}
.nav .navbrand,.nav .navme,.nav .navfoot{display:none}
#qSave{white-space:nowrap;flex:none}

@media (min-width:900px){
  .frame{flex-direction:row}
  .nav{order:-1;width:244px;flex:none;display:flex;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:22px 14px 18px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:12px;font-size:15px;color:var(--ink)}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
  .nav .navbrand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;padding:0 8px 20px;letter-spacing:-.01em}
  .navme{display:flex!important;margin-top:auto;border-top:1px solid var(--line);border-radius:0 0 12px 12px!important;padding-top:14px!important}
  .navme .meav{width:32px;height:32px;font-size:14px;display:grid;place-items:center}
  .navme span:last-child{display:flex;flex-direction:column;line-height:1.3;text-align:left}
  .navme small{font-size:12px;color:var(--muted);font-weight:500}
  .nav .navfoot{display:block;font-size:11.5px;color:var(--faint);padding:10px 8px 0;line-height:1.5}
  .scroll{padding-bottom:56px}
  .pad{padding-inline:32px}
  .desk-only{display:flex!important}
  .mob-only{display:none!important}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
  .split > .main{grid-column:1;grid-row:1 / span 2}
  .split > .a1{grid-column:2;grid-row:1}
  .split > .a2{grid-column:2;grid-row:2}
}

/* ---------- headers ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 0}
@media (min-width:900px){.top{padding:24px 32px 0}.top .logo{display:none}.titlebar{padding:36px 32px 6px!important}.titlebar h1{font-size:30px!important}.titlebar p{font-size:15px!important}}
.titlebar{padding:20px 16px 4px}
.titlebar h1{font-size:24px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.titlebar p{margin:4px 0 0;color:var(--muted);font-size:14px}
.searchrow{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px;color:var(--faint);min-width:0}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.bell{position:relative;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.bell b{position:absolute;top:2px;right:-2px;background:var(--bad);color:#fff;font-size:10px;line-height:1;padding:3px 5px;border-radius:999px;font-family:var(--mono)}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;padding:8px 0 12px;font-size:16px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-text);font-weight:700}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:-1px;width:22px;height:4px;border-radius:4px;background:var(--accent);transform:translateX(-50%)}

/* ---------- cards & common ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px}
.card h2,.sec h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sechead .more{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--accent-soft);color:var(--accent-text)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{background:var(--sunk);color:var(--faint);cursor:not-allowed}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.inp{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px;color:var(--ink);width:100%;min-width:0}
textarea.inp{height:auto;min-height:76px;padding:10px 12px;resize:vertical}
.unit{position:relative}
.unit .inp{padding-right:52px;font-family:var(--mono)}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--line)}

/* ---------- feed ---------- */
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent-text);border-radius:var(--r-md);padding:10px 14px;font-size:13.5px;font-weight:500}
.masonry{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.post{background:var(--surface);border-radius:var(--r-md);overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.post .th{position:relative;display:block}
.post .th > svg{display:block;width:100%;height:auto}
img.tph{display:block;width:100%;max-width:100%;height:auto;object-fit:cover;background:var(--sunk)}
.mini img.tph{height:96px}
.hero img.tph{max-height:240px}
.thumbs img.tph{height:100%}
.post .kind{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;background:rgba(20,26,22,.82);color:#fff;display:flex;align-items:center;gap:3px}
.post .kind.case{background:var(--accent);color:var(--accent-ink)}
.post .kind.q{background:var(--info);color:#fff}
.post .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.post h3{font-size:14.5px;line-height:1.4;margin:0;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .spec{font-size:12px;color:var(--muted)}
.post .foot{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.like{display:flex;align-items:center;gap:3px;color:var(--muted)}
.like[aria-pressed="true"]{color:var(--accent-text)}
.like[aria-pressed="true"] svg{fill:var(--accent-soft)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.fab{position:absolute;right:16px;bottom:88px;z-index:6;display:flex;align-items:center;gap:6px;height:48px;padding:0 18px 0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 20px rgba(0,120,45,.35)}

/* ---------- sheet & toast ---------- */
.sheetwrap{position:absolute;inset:0;z-index:20;background:rgba(8,14,10,.45);display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheethead h2{font-size:19px;line-height:1.35;margin:0;text-wrap:balance}
.x{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:none}
.hero{border-radius:var(--r-md);overflow:hidden}
.hero svg{display:block;width:100%;height:auto;max-height:240px}
.block h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.block p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.kv div{padding:9px 12px;border-top:1px solid var(--line)}
.kv div:nth-child(-n+2){border-top:0}
.kv div:nth-child(odd){color:var(--muted);background:var(--bg)}
.kv div:nth-child(even){font-family:var(--mono);font-weight:500}
.verify{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px}
.verify strong{color:var(--accent-text)}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;white-space:nowrap;animation:up .2s ease}
@keyframes up{from{transform:translateY(16px);opacity:.4}}
.toast{animation-name:toastin}
@media (min-width:900px){.sheetwrap{align-items:center;justify-content:center;padding:32px}.sheet{max-width:600px;max-height:88%;border-radius:24px;padding:20px 24px 28px}.grab{display:none}.fab{bottom:28px;right:32px}.toast{bottom:32px;left:calc(50% + 122px)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes fade{from{opacity:0}}

/* ---------- troubleshoot ---------- */
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.step b{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-family:var(--mono)}
.symgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sym{border:2px solid var(--line);border-radius:var(--r-md);overflow:hidden;text-align:left;display:flex;flex-direction:column;background:var(--surface)}
.symimg{position:relative;display:block}
.symimg > svg,.symimg > img{display:block;width:100%;aspect-ratio:4/3;height:auto;object-fit:cover}
.phtag{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(20,26,22,.78);color:#fff}
.symtx{display:flex;flex-direction:column;gap:2px;padding:9px 10px 11px}
.sym strong{font-size:14px;line-height:1.35}
.symtx > span{font-size:12px;color:var(--muted);line-height:1.4}
.sym[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.upl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:168px;border-radius:var(--r-lg);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;padding:20px;box-shadow:0 10px 24px rgba(0,120,45,.25)}
.upl:hover{filter:brightness(1.05)}
.upl:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.uplic{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.uplic svg{width:28px;height:28px}
.upl b{font-size:22px;letter-spacing:-.01em}
.upl > span:last-child{font-size:13.5px;opacity:.9}
.upl.has{padding:0;min-height:0;background:var(--surface);color:var(--ink);overflow:hidden;cursor:default;box-shadow:var(--shadow)}
.upl.has img{display:block;width:100%;max-height:280px;object-fit:cover}
.uplbar{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;font-size:14px;font-weight:600}
.uplbar > span:first-child{display:flex;align-items:center;gap:6px;color:var(--accent-text)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:4px}
.compare figure > img,.compare figure > svg,.nophoto{display:block;width:100%;aspect-ratio:1;height:auto;object-fit:cover;border-radius:12px;overflow:hidden}
.nophoto{background:var(--sunk);display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);font-size:12px}
.compare figcaption{font-size:12px;color:var(--muted);text-align:center}
.photo{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:12px;cursor:pointer}
.photo img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.photo .ph{width:56px;height:56px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.cause{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cause:first-of-type{border-top:0}
.cbox{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--faint);display:grid;place-items:center;margin-top:1px}
.cbox[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cbox svg{width:15px;height:15px;stroke-width:2.6;opacity:0}
.cbox[aria-checked="true"] svg{opacity:1}
.cause .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:600;font-size:14.5px}
.cause p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.cause.done .t span:first-child{text-decoration:line-through;color:var(--muted)}
.prog{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 150px;background:var(--bg);border-radius:var(--r-md);overflow:hidden;text-align:left}
.mini svg{display:block;width:100%;height:96px}
.mini div{padding:8px 10px;font-size:12.5px;font-weight:600;line-height:1.35}
.mini small{display:block;color:var(--muted);font-weight:500;margin-top:2px}

/* ---------- cost ---------- */
.quote{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.quote .lbl{font-size:13px;opacity:.7}
.quote .big{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.quote .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.quote .row span:last-child{font-family:var(--mono)}
.stack{display:flex;height:10px;border-radius:10px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.legend div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.legend div span:first-child{display:flex;align-items:center;gap:6px;opacity:.8}
.legend em{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend .mono{opacity:.95}
.saved{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.saved:first-child{border-top:0}
.saved .mono{font-weight:600}

/* ---------- prep ---------- */
.device{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 16px 0}
.device select{border:0;background:none;font-size:22px;font-weight:700;letter-spacing:-.01em;padding:0;appearance:none;-webkit-appearance:none;max-width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.job{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.job .gc{width:84px;height:84px;border-radius:12px;background:var(--sunk);display:grid;place-items:center}
.job .pct{font-family:var(--mono);font-size:24px;font-weight:600}
.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.temp{background:var(--surface);border-radius:var(--r-md);padding:12px}
.temp small{display:block;color:var(--muted);font-size:12px}
.temp b{font-family:var(--mono);font-size:22px;font-weight:600}
.temp b span{font-size:12px;color:var(--muted);font-weight:500}
.matgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.matgrid div{background:var(--bg);border-radius:12px;padding:10px 12px}
.matgrid small{display:block;font-size:12px;color:var(--muted)}
.matgrid b{font-family:var(--mono);font-size:16px;font-weight:600}
.check{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.check:first-child{border-top:0}
.check span{font-size:14.5px}
.check small{display:block;color:var(--muted);font-size:12.5px}
.check.done span{color:var(--muted)}

/* ---------- AI coach ---------- */
.srcs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.srcs span{display:flex;align-items:center;gap:6px}
.srcs i{width:8px;height:8px;border-radius:2px;display:inline-block}

function shade(hex, amt){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return '#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1); }
function gearPath(cx,cy,ro,ri,n){ let d=''; for(let i=0;i<n*2;i++){ const a0=Math.PI*i/n, a1=Math.PI*(i+1)/n, r=i%2?ri:ro;
  const p=(a)=>(cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);
  d+=(i?'L':'M')+p(a0+0.08)+'L'+p(a1-0.08); } return d+'Z'; }

/* ---------- troubleshoot + AI coach ---------- */
// Simulated feedback from other users: [tries, success rate] per cause, same order as SYM[sym].causes
const FB_PRIOR = {
  spaghetti:[[48,.71],[22,.55],[30,.60],[12,.42]],
  underext:[[35,.52],[28,.61],[41,.74],[19,.68],[16,.50]],
  clog:[[26,.66],[14,.79],[20,.45],[24,.58],[9,.44]],
  adhesion:[[52,.63],[61,.77],[25,.48],[18,.40]],
  warping:[[33,.70],[21,.52],[44,.73],[17,.41]],
  stringing:[[57,.76],[39,.58],[34,.55],[15,.38]],
  layershift:[[29,.72],[23,.61],[12,.50],[8,.35]]
};
const FB_SCORE = {solved:1, better:0.5, same:0, worse:0};
const RATINGS = [['solved','해결됐어요'],['better','나아졌어요'],['same','그대로예요'],['worse','더 나빠졌어요']];
const MY_WEIGHT = 8; // the user's own feedback counts more than the crowd prior for their printer/material
let afterURL = null;
const coachVersion = () => 'v1.' + st.coachLog.length;
function fbRate(sym, mat, i){
  const pr = (FB_PRIOR[sym]||[])[i] || [10,.5], L = st.learn[`${sym}|${mat}|${i}`] || {t:0,s:0};
  return {rate:(pr[0]*pr[1] + MY_WEIGHT*L.s)/(pr[0] + MY_WEIGHT*L.t), n:pr[0]+L.t, mine:L.t};
}
function communityFor(sym, mat, i){
  const cs = allPosts().filter(p=>p.type==='case' && p.sym===sym && (p.fixes||[]).includes(i));
  const people = cs.reduce((a,p)=>a+solvedCount(p)*(p.mat===mat?1:0.5),0);
  const best = cs.slice().sort((a,b)=>(b.mat===mat)-(a.mat===mat)||solvedCount(b)-solvedCount(a))[0];
  return {cases:cs.length, people:Math.round(people), best};
}
function diagnose(){
  const d = st.diag, s = SYM[d.sym];
  const rows = s.causes.map((c,i)=>{ const ai=c.w+((c.mat&&c.mat[d.mat])||0); return {...c,i,ai,comm:communityFor(d.sym,d.mat,i),fb:fbRate(d.sym,d.mat,i)}; }).filter(c=>c.ai>0||c.comm.cases>0);
  const maxAi = Math.max(1,...rows.map(c=>c.ai)), maxC = Math.max(1,...rows.map(c=>c.comm.people));
  rows.forEach(c=>{ c.score = Math.round(100*(0.45*Math.max(0,c.ai)/maxAi + 0.25*c.comm.people/maxC + 0.30*c.fb.rate)); });
  return rows.sort((a,b)=>b.score-a.score);
}

/* ---------- cost ---------- */
const COST_FIELDS = [
  ['g','필라멘트 사용량','g'],['h','출력 시간','h'],['qty','수량','개'],['kg','필라멘트 단가','원/kg'],
  ['w','소비 전력','W'],['kwh','전기 요금','원/kWh'],['dev','장비 가격','원'],['life','장비 수명','h'],
  ['min','후가공 시간','분'],['wage','시급','원'],['fail','실패율','%'],['margin','마진율','%']];
const SEG = [['mat','재료','#22A559'],['pow','전기','#E4B33B'],['dep','장비 감가','#4A86E8'],['lab','후가공 인건비','#E8833A'],['fail','실패 보정','#D9534F']];
function calc(){
  const c = st.cost, n = k => Math.max(0, Number(c[k])||0);
  const mat = n('g')/1000*n('kg'), pow = n('w')/1000*n('h')*n('kwh'), dep = n('life')?n('dev')/n('life')*n('h'):0, lab = n('min')/60*n('wage');
  const sub = mat+pow+dep+lab, fail = sub*n('fail')/100, cost = sub+fail, unit = Math.ceil(cost*(1+n('margin')/100)/100)*100;
  const qty = Math.max(1, Math.round(n('qty')));
  return {mat,pow,dep,lab,fail,cost,unit,qty,total:unit*qty,profit:(unit-cost)*qty};
}

    ['profile',`슬라이서 프로파일이 ${mat}로 되어 있어요`,`노즐 ${m.nozzle}℃ · 베드 ${m.bed}℃`],['level','자동 레벨링을 켰어요','판을 바꿨다면 꼭 다시 실행하세요'],

  const extra = {ABS:[['enc','문과 덮개를 닫고 챔버를 예열했어요','10분 예열 · 환기는 외부로']],ASA:[['enc','문과 덮개를 닫고 챔버를 예열했어요','10분 예열 · 환기는 외부로']],

  return base.concat(extra[mat]||[]);

      <div class="sechead"><h2>출력 전 체크리스트</h2><span class="small mono">${doneN}/${list.length}</span></div>
      <div class="prog"><i style="width:${doneN/list.length*100}%"></i></div>
      <div>${list.map(([k,t,s])=>`<button class="check ${ck[k]?'done':''}" data-pcheck="${k}"><span class="cbox" role="checkbox" aria-checked="${!!ck[k]}">${ic('check')}</span><span>${esc(t)}<small>${esc(s)}</small></span></button>`).join('')}</div>
      <div class="btnrow"><button class="btn ghost" id="pReset">초기화</button><button class="btn primary" id="pGo" ${doneN===list.length?'':'disabled'}>출력 준비 완료</button></div>
    </div></div>
    <div class="a1"><div class="card sec">
      <h2>소재 가이드</h2>
      <div class="chips">${Object.keys(MAT).map(x=>`<button class="chip" data-pmat="${x}" aria-pressed="${mat===x}">${x}</button>`).join('')}</div>
      <div class="matgrid"><div><small>노즐</small><b>${m.nozzle}℃</b></div><div><small>베드</small><b>${m.bed}℃</b></div><div><small>냉각 팬</small><b>${m.fan}</b></div><div><small>인클로저</small><b style="font-family:var(--sans)">${m.enc}</b></div></div>
      <p class="small muted" style="margin:0">${m.note}</p>
    </div></div>
  </div>`;
}

/* ---------- me ---------- */
function viewMe(v){
  const savedList = allPosts().filter(p=>st.saved[p.id]);
  const contrib = st.posts.filter(p=>p.type==='case').length + Object.keys(st.solved).filter(k=>st.solved[k]).length;
  v.className='view';
  v.innerHTML = `
  <div class="profile pad"><div class="bigav">S<i>LV 14</i></div><div style="min-width:0"><h2>메이커 스튜디오</h2><p>@maker_studio · 소규모 출력 외주</p><p class="mono">${st.printers.length} 프린터 · ${st.posts.length} 게시물</p></div></div>
  <div class="pad mecols">
    <div class="card quick full">
      <div><b>${st.printed}</b><small>출력 기록</small></div>
      <div><b>${savedList.length}</b><small>저장한 글</small></div>
      <div><b>${contrib}</b><small>해결 기여</small></div>
      <div><b>${st.quotes.length}</b><small>저장 견적</small></div>
    </div>
    <div class="card sec">
      <div class="sechead"><h2>저장한 글</h2><button class="more" data-gofeed="saved">전체 ${ic('chev','sm')}</button></div>
      ${savedList.length?`<div class="thumbs">${savedList.map(p=>`<button data-open="${p.id}" aria-label="${esc(p.title)}">${thumb(p,200,uid())}</button>`).join('')}</div>`:`<p class="note" style="margin:0">커뮤니티에서 저장한 글이 여기에 모여요.</p>`}
    </div>
    <div class="card sec">
      <div class="sechead"><h2>내 프린터</h2></div>
      <div>${st.printers.map(p=>`<div class="prow"><span class="pi">${ic('printer')}</span><div><b style="font-size:14.5px">${esc(p.name)}</b><small>${esc(p.model)}</small></div>${p.id===st.activePrinter?'<span class="tag ok">사용 중</span>':`<button class="chip" data-use="${p.id}">사용</button>`}</div>`).join('')}</div>
      <form id="addPr" style="display:flex;gap:8px"><input class="inp" id="prName" placeholder="이름" maxlength="20" required><select class="inp" id="prModel" style="max-width:110px">${PRINTERS.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn primary" style="height:44px;padding:0 14px" aria-label="프린터 추가">${ic('plus','sm')}</button></form>
    </div>
        <div class="card sec">
      <div class="sechead"><h2>코칭 기록</h2><span class="tag ok mono">AI 코치 ${coachVersion()}</span></div>
      ${st.coachLog.length?`<div>${st.coachLog.slice(0,6).map(l=>`<div class="saved"><div><b style="font-size:14px">${esc(SYM[l.sym].label)}</b><div class="note">${esc(l.printer)} · ${esc(l.mat)} · ${esc(l.date)} · 적용 ${l.applied.length}개 · ${esc(l.ver||'')}</div></div><span class="tag ${l.rating==='solved'?'ok':l.rating==='better'?'info':l.rating==='same'?'warn':'bad'}">${(RATINGS.find(r=>r[0]===l.rating)||['',''])[1]}</span></div>`).join('')}</div>`
        :`<p class="note" style="margin:0">문제해결에서 코칭을 받고 수정 결과를 알려 주면 여기에 쌓이고, 그만큼 코칭 AI가 업그레이드돼요.</p>`}
    </div>
    <div class="card sec">
      <h2>데이터</h2>
      <p class="note" style="margin:0">입력한 기록과 코칭 학습 내용은 이 브라우저에만 저장돼요. 커뮤니티 글, 장비 연결, AI 진단, 다른 사용자 피드백 수치는 시연용 예시예요.</p>
      <div id="resetBox"><button class="btn ghost block" id="resetAsk">내 기록 초기화</button></div>
    </div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-like],[data-open]'); if(!t) return;
  const ds = t.dataset;
  if(ds.tab){ go(ds.tab); return; }
  if(ds.like){ e.stopPropagation(); st.liked[ds.like]=!st.liked[ds.like]; save();
    document.querySelectorAll(`[data-like="${ds.like}"]`).forEach(b=>{ b.setAttribute('aria-pressed',!!st.liked[ds.like]); const n=b.querySelector('.mono'); if(n) n.textContent=likeCount(byId(ds.like)); }); return; }
  if(ds.open){ openPost(ds.open); return; }
  if(ds.shareNew!==undefined){ openPostForm(); return; }
  if(t.id==='photoClear'){ if(photoURL) URL.revokeObjectURL(photoURL); photoURL=null; viewFix($('#view')); return; }
  if(ds.close!==undefined){ closeSheet(); return; }
  if(ds.feed){ st.feed=ds.feed; save(); viewCommunity($('#view')); return; }
  if(ds.act==='bell'){ toast('새 답변 3개: 내 질문에 답이 달렸어요'); return; }
  if(ds.save){ st.saved[ds.save]=!st.saved[ds.save]; save(); t.setAttribute('aria-pressed',!!st.saved[ds.save]); t.textContent=st.saved[ds.save]?'저장됨':'저장'; toast(st.saved[ds.save]?'저장했어요':'저장을 취소했어요'); refreshBehind(); return; }
  if(ds.solve){ st.solved[ds.solve]=!st.solved[ds.solve]; save(); t.setAttribute('aria-pressed',!!st.solved[ds.solve]); t.textContent=st.solved[ds.solve]?'해결 확인함':'나도 해결됐어요';
    $('#solvedN').textContent=solvedCount(byId(ds.solve))+'명'; if(st.solved[ds.solve]) toast('해결 확인을 남겼어요. 다음 추천에 반영돼요'); refreshBehind(); return; }
  if(ds.toprep){ st.prepMat=ds.toprep; go('prep'); toast(ds.toprep+' 출력 체크리스트를 열었어요'); return; }
  if(ds.tocost){ const p=byId(ds.tocost); Object.assign(st.cost,{mat:p.mat,kg:MAT[p.mat].price,qty:p.qty,g:p.grams,h:p.hours,min:p.qty>=50?3:30}); go('cost'); toast('요청 내용으로 견적을 채웠어요'); return; }
  if(ds.dprinter){ st.diag.printer=ds.dprinter; st.diag.ran=false; resetFb(); save(); viewFix($('#view')); return; }
  if(ds.dmat){ st.diag.mat=ds.dmat; st.diag.ran=false; resetFb(); save(); viewFix($('#view')); return; }
  if(ds.dsym){ st.diag.sym=ds.dsym; st.diag.ran=false; resetFb(); save(); viewFix($('#view')); return; }
  if(t.id==='runDiag'){ st.diag.ran=true; save(); t.innerHTML=ic('spark','sm')+'증상과 사례를 비교하는 중…'; t.disabled=true;
    setTimeout(()=>{ viewFix($('#view')); const o=$('#diagOut'); if(o) o.scrollIntoView({behavior:'smooth',block:'start'}); }, 600); return; }
  if(ds.cdone!==undefined){ if(st.diag.fbDone) return; st.diag.done[ds.cdone]=!st.diag.done[ds.cdone]; save(); drawDiag(); return; }
  if(ds.rate){ st.diag.rating=ds.rate; save(); drawDiag(); return; }
  if(t.id==='fbSend'){ const d=st.diag, before=diagnose(), applied=before.filter(c=>d.done[c.i]); if(!applied.length||!d.rating) return;
    const rb={}, br={}; before.forEach((c,k)=>{ rb[c.i]=k+1; br[c.i]=Math.round(c.fb.rate*100); });
    const from = coachVersion();
    applied.forEach(c=>{ const k=`${d.sym}|${d.mat}|${c.i}`, L=st.learn[k]||{t:0,s:0}; L.t++; L.s+=FB_SCORE[d.rating]; st.learn[k]=L; });
    st.coachLog.unshift({date:new Date().toLocaleDateString('ko-KR',{month:'short',day:'numeric'}),sym:d.sym,mat:d.mat,printer:d.printer,rating:d.rating,applied:applied.map(c=>c.t),memo:d.memo||''});
    const to = coachVersion(); st.coachLog[0].ver = to;
    const after = diagnose(), ra={}; after.forEach((c,k)=>ra[c.i]=k+1);
    d.update = {from,to,changes:applied.map(c=>{ const a=after.find(x=>x.i===c.i); return {t:c.t,before:br[c.i],after:Math.round(a.fb.rate*100),rb:rb[c.i],ra:ra[c.i]}; })};
    d.fbDone = true; save(); drawDiag(); toast(`코칭 AI를 ${to}로 업그레이드했어요`); return; }
  if(t.id==='coachNext'){ const d=st.diag; d.done={}; d.fbDone=false; d.rating=null; d.memo=''; d.update=null; if(afterURL){ URL.revokeObjectURL(afterURL); afterURL=null; } save(); drawDiag(); toast('피드백을 반영한 새 코칭 순서예요'); return; }
  if(t.id==='diagNew'){ resetFb(); st.diag.ran=false; st.diag.sym=null; if(photoURL){ URL.revokeObjectURL(photoURL); photoURL=null; } save(); viewFix($('#view')); $('#scroll').scrollTop=0; return; }
  if(ds.share){ const d=st.diag; openPostForm({type:ds.share,printer:d.printer,mat:d.mat,sym:d.sym,
    title: ds.share==='case'?`${d.mat} ${SYM[d.sym].label.replace(/요$/,'던 문제')} 해결`:`${d.printer}에서 ${d.mat} ${SYM[d.sym].label.replace(/어요$|아요$|요$/,'')}는 문제`,
    solution: ds.share==='case'?diagnose().filter(c=>d.done[c.i]).map(c=>c.fix).join(' '):'', fixes: diagnose().filter(c=>d.done[c.i]).map(c=>c.i)}); return; }
  if(ds.cmat){ st.cost.mat=ds.cmat; st.cost.kg=MAT[ds.cmat].price; save(); viewCost($('#view')); return; }
  if(t.id==='qSave'){ const name=$('#qName').value.trim()||`${st.cost.mat} 출력 견적`; const r=calc();
    st.quotes.unshift({name,mat:st.cost.mat,qty:r.qty,total:r.total,date:new Date().toLocaleDateString('ko-KR',{month:'short',day:'numeric'})}); save(); $('#qName').value=''; drawQuotes(); toast('견적을 저장했어요'); return; }
  if(t.id==='qCopy'){ const txt=quoteText($('#qName').value.trim());
    const fallback=()=>{ openSheet(`<div class="sheethead"><h2>견적 내용</h2><button class="x" data-close aria-label="닫기">${ic('x','sm')}</button></div><textarea class="inp" id="qTxt" rows="6" readonly>${esc(txt)}</textarea><p class="note" style="margin:0">복사가 막혀 있어요. 텍스트를 선택해 직접 복사해 주세요.</p>`, w=>{ const a=w.querySelector('#qTxt'); a.focus(); a.select(); }); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast('견적 내용을 복사했어요'),fallback); }catch(err){ fallback(); } return; }
  if(ds.qdel!==undefined){ st.quotes.splice(+ds.qdel,1); save(); drawQuotes(); toast('견적을 삭제했어요'); return; }
  if(ds.pmat){ st.prepMat=ds.pmat; save(); viewPrep($('#view')); return; }
  if(ds.pcheck){ const m=st.prepMat; st.checks[m]=st.checks[m]||{}; st.checks[m][ds.pcheck]=!st.checks[m][ds.pcheck]; save(); const y=$('#scroll').scrollTop; viewPrep($('#view')); $('#scroll').scrollTop=y; return; }
  if(t.id==='pReset'){ st.checks[st.prepMat]={}; save(); viewPrep($('#view')); return; }
  if(t.id==='pGo'){ st.printed++; st.checks[st.prepMat]={}; save(); viewPrep($('#view')); toast('준비 완료. 출력 기록에 남겼어요'); return; }
  if(ds.use){ st.activePrinter=ds.use; save(); viewMe($('#view')); toast('사용 중인 프린터를 바꿨어요'); return; }
  if(ds.gofeed){ st.feed=ds.gofeed; go('community'); return; }
  if(t.id==='resetAsk'){ $('#resetBox').innerHTML=`<p class="small" style="margin:0 0 8px">저장, 좋아요, 견적, 내 글이 모두 지워져요.</p><div class="btnrow"><button class="btn ghost" id="resetNo">취소</button><button class="btn primary" id="resetYes" style="background:var(--bad);color:#fff">초기화</button></div>`; return; }
  if(t.id==='resetNo'){ viewMe($('#view')); return; }
  if(t.id==='resetYes'){ try{ localStorage.removeItem(KEY); }catch(err){} st=load(); photoURL=null; go('me'); toast('기록을 초기화했어요'); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeSheet();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-like][role="button"]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='q'){ st.q=t.value; save(); drawFeed(); }
  if(t.id==='fbMemo'){ st.diag.memo=t.value; save(); }
  if(t.dataset.cost){ st.cost[t.dataset.cost]=t.value; save(); updateCost(); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='afterIn' && t.files[0]){ if(afterURL) URL.revokeObjectURL(afterURL); afterURL=URL.createObjectURL(t.files[0]); drawDiag(); }
  if(t.id==='photoIn' && t.files[0]){ if(photoURL) URL.revokeObjectURL(photoURL); photoURL=URL.createObjectURL(t.files[0]); viewFix($('#view')); }
  if(t.id==='prSel'){ st.activePrinter=t.value; save(); viewPrep($('#view')); }
});
document.addEventListener('submit', e=>{
  if(e.target.id==='addPr'){ e.preventDefault(); const name=$('#prName').value.trim(); if(!name) return;
    st.printers.push({id:'p'+Date.now(),name,model:$('#prModel').value}); save(); viewMe($('#view')); toast('프린터를 추가했어요'); }
});
function refreshBehind(){ if(st.tab==='community'){ const y=$('#scroll').scrollTop; drawFeed(); $('#scroll').scrollTop=y; } else if(st.tab==='me'){ const s=$('#sheet'); const keep=s&&s.parentNode; if(keep) s.remove(); viewMe($('#view')); if(keep) $('#frame').appendChild(s); } else if(st.tab==='fix'&&st.diag.ran){ drawDiag(); } }

let rsz; addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(st.tab==='community') drawFeed(); },150); });

/* ---------- boot ---------- */
const h = location.hash.slice(1); st.tab = (TABS.some(x=>x[0]===h) || h==='me') ? h : 'home';
renderNav(); render();
})();
</script>
